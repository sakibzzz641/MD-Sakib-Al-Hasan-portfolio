<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradTelco1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="aucFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.35)"/>
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0.0)"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="800" height="450" rx="12" fill="url(#bgGradTelco1)"/>
  <rect width="800" height="450" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="38" fill="#f8fafc" font-family="Inter, sans-serif" font-size="16" font-weight="700">ROC-AUC Multi-Model Benchmark (Telco Customer Churn)</text>
  <text x="40" y="58" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">Evaluated on 1,057 Held-Out Test Customers · Stratified 70/15/15 Split</text>

  <!-- Legend & Highlight Pill -->
  <g transform="translate(480, 24)">
    <rect width="280" height="42" rx="8" fill="#032b43" stroke="#0284c7" stroke-width="1"/>
    <circle cx="18" cy="21" r="5" fill="#38bdf8"/>
    <text x="32" y="25" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">Tuned Logistic Regression</text>
    <text x="210" y="25" fill="#bae6fd" font-family="JetBrains Mono, monospace" font-size="11">0.844 AUC</text>
  </g>

  <!-- Chart Area: Origin (100, 360), Top-Right (700, 100) -->
  <!-- Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3">
    <line x1="100" y1="360" x2="700" y2="360"/>
    <line x1="100" y1="295" x2="700" y2="295"/>
    <line x1="100" y1="230" x2="700" y2="230"/>
    <line x1="100" y1="165" x2="700" y2="165"/>
    <line x1="100" y1="100" x2="700" y2="100"/>

    <line x1="100" y1="100" x2="100" y2="360"/>
    <line x1="250" y1="100" x2="250" y2="360"/>
    <line x1="400" y1="100" x2="400" y2="360"/>
    <line x1="550" y1="100" x2="550" y2="360"/>
    <line x1="700" y1="100" x2="700" y2="360"/>
  </g>

  <!-- Axis Values -->
  <text x="100" y="380" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">0.0</text>
  <text x="250" y="380" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">0.25</text>
  <text x="400" y="380" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">0.50 (FPR)</text>
  <text x="550" y="380" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">0.75</text>
  <text x="700" y="380" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">1.0</text>

  <text x="85" y="364" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="end">0.0</text>
  <text x="85" y="299" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="end">0.25</text>
  <text x="85" y="234" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="end">0.50 (TPR)</text>
  <text x="85" y="169" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="end">0.75</text>
  <text x="85" y="104" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="end">1.0</text>

  <!-- Random Baseline Diagonal -->
  <line x1="100" y1="360" x2="700" y2="100" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="470" y="230" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10" transform="rotate(-23 470 230)">Random Classifier (0.50)</text>

  <!-- Other Models Curves -->
  <!-- KNN (0.783) -->
  <path d="M 100 360 Q 150 210, 260 170 T 520 120 T 700 100" fill="none" stroke="#64748b" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Decision Tree (0.820) -->
  <path d="M 100 360 Q 140 180, 240 155 T 480 115 T 700 100" fill="none" stroke="#eab308" stroke-width="1.5" opacity="0.75"/>
  
  <!-- Gradient Boosting (0.841) -->
  <path d="M 100 360 Q 130 160, 230 142 T 460 110 T 700 100" fill="none" stroke="#10b981" stroke-width="1.8" opacity="0.85"/>
  
  <!-- Random Forest (0.842) -->
  <path d="M 100 360 Q 125 155, 220 140 T 450 108 T 700 100" fill="none" stroke="#a855f7" stroke-width="1.8" opacity="0.85"/>

  <!-- Winner: Tuned Logistic Regression (0.844) with Area Fill -->
  <path d="M 100 360 Q 120 150, 215 136 T 440 106 T 700 100 L 700 360 Z" fill="url(#aucFill)"/>
  <path d="M 100 360 Q 120 150, 215 136 T 440 106 T 700 100" fill="none" stroke="#06b6d4" stroke-width="3"/>

  <!-- Operating Threshold Point (Threshold = 0.50, Recall = 76.5%, FPR = 26.2%) -->
  <!-- FPR 0.262 = 100 + 0.262*600 = 257. TPR 0.765 = 360 - 0.765*260 = 161 -->
  <circle cx="257" cy="161" r="7" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>
  <circle cx="257" cy="161" r="14" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Operating Point Callout -->
  <g transform="translate(280, 150)">
    <rect width="215" height="58" rx="6" fill="#041f31" stroke="#0891b2" stroke-width="1.2"/>
    <text x="12" y="18" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">Operating Point (t = 0.50)</text>
    <text x="12" y="34" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="10">Recall: 76.51% (215 caught)</text>
    <text x="12" y="48" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="9">Precision: 51.44% | F1: 0.6152</text>
  </g>

  <!-- Legend Bottom Row -->
  <g transform="translate(100, 415)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#06b6d4" stroke-width="3"/>
    <text x="26" y="4" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="10">Logistic Reg (0.844)</text>

    <line x1="180" y1="0" x2="200" y2="0" stroke="#10b981" stroke-width="2"/>
    <text x="206" y="4" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">Gradient Boost (0.841)</text>

    <line x1="370" y1="0" x2="390" y2="0" stroke="#a855f7" stroke-width="2"/>
    <text x="396" y="4" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">Random Forest (0.842)</text>

    <line x1="550" y1="0" x2="570" y2="0" stroke="#eab308" stroke-width="2"/>
    <text x="576" y="4" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">Decision Tree (0.820)</text>
  </g>
</svg>
