<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradTelco2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="tnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e3a5a"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="fpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="fnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="800" height="450" rx="12" fill="url(#bgGradTelco2)"/>
  <rect width="800" height="450" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="38" fill="#f8fafc" font-family="Inter, sans-serif" font-size="16" font-weight="700">Confusion Matrix &amp; Retention Sieve (Tuned Logistic Regression)</text>
  <text x="40" y="58" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">Held-Out Test Set: 1,057 Total Customers · 281 Actual Churners · Threshold = 0.50</text>

  <!-- Matrix Layout: Starts around x=180, y=95 -->
  <!-- Top Prediction Labels -->
  <text x="320" y="90" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" text-anchor="middle">Predicted: RETAIN (No)</text>
  <text x="510" y="90" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" text-anchor="middle">Predicted: CHURN (Yes)</text>

  <!-- Row 1: Actual Retained (No) -->
  <text x="210" y="165" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" text-anchor="end">Actual: RETAIN</text>
  <text x="210" y="180" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="end">(776 Stayers)</text>

  <!-- Cell 1: TN (573) -->
  <g transform="translate(230, 105)">
    <rect width="180" height="120" rx="8" fill="url(#tnGrad)" stroke="#0891b2" stroke-width="1.5"/>
    <text x="90" y="42" fill="#e0f2fe" font-family="JetBrains Mono, monospace" font-size="28" font-weight="800" text-anchor="middle">573</text>
    <text x="90" y="68" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" text-anchor="middle">TRUE NEGATIVE (TN)</text>
    <text x="90" y="88" fill="#bae6fd" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Correctly predicted loyal</text>
    <text x="90" y="104" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">Specificity: 73.84%</text>
  </g>

  <!-- Cell 2: FP (203) -->
  <g transform="translate(420, 105)">
    <rect width="180" height="120" rx="8" fill="url(#fpGrad)" stroke="#d97706" stroke-width="1.5"/>
    <text x="90" y="42" fill="#fef3c7" font-family="JetBrains Mono, monospace" font-size="28" font-weight="800" text-anchor="middle">203</text>
    <text x="90" y="68" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" text-anchor="middle">FALSE POSITIVE (FP)</text>
    <text x="90" y="88" fill="#fde68a" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">False alarm retention offer</text>
    <text x="90" y="104" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">Acceptable retention buffer</text>
  </g>

  <!-- Row 2: Actual Churned (Yes) -->
  <text x="210" y="295" fill="#f43f5e" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" text-anchor="end">Actual: CHURN</text>
  <text x="210" y="310" fill="#fda4af" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="end">(281 Churners)</text>

  <!-- Cell 3: FN (66) -->
  <g transform="translate(230, 235)">
    <rect width="180" height="120" rx="8" fill="url(#fnGrad)" stroke="#e11d48" stroke-width="1.5"/>
    <text x="90" y="42" fill="#ffe4e6" font-family="JetBrains Mono, monospace" font-size="28" font-weight="800" text-anchor="middle">66</text>
    <text x="90" y="68" fill="#fb7185" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" text-anchor="middle">FALSE NEGATIVE (FN)</text>
    <text x="90" y="88" fill="#fecdd3" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Missed churners (unflagged)</text>
    <text x="90" y="104" fill="#fda4af" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">Only 23.49% missed</text>
  </g>

  <!-- Cell 4: TP (215) -->
  <g transform="translate(420, 235)">
    <rect width="180" height="120" rx="8" fill="url(#tpGrad)" stroke="#10b981" stroke-width="2"/>
    <text x="90" y="42" fill="#d1fae5" font-family="JetBrains Mono, monospace" font-size="28" font-weight="800" text-anchor="middle">215</text>
    <text x="90" y="68" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" text-anchor="middle">TRUE POSITIVE (TP)</text>
    <text x="90" y="88" fill="#a7f3d0" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Caught 76.51% of churners</text>
    <text x="90" y="104" fill="#ecfdf5" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">Priority Retention Queue</text>
  </g>

  <!-- Summary Metric Pills Right Column -->
  <g transform="translate(620, 105)">
    <rect width="145" height="55" rx="8" fill="#041b2d" stroke="#0284c7" stroke-width="1"/>
    <text x="12" y="20" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">CHURN RECALL</text>
    <text x="12" y="42" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="18" font-weight="800">76.51%</text>
  </g>

  <g transform="translate(620, 170)">
    <rect width="145" height="55" rx="8" fill="#062822" stroke="#059669" stroke-width="1"/>
    <text x="12" y="20" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">F1 SCORE</text>
    <text x="12" y="42" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="18" font-weight="800">0.6152</text>
  </g>

  <g transform="translate(620, 235)">
    <rect width="145" height="55" rx="8" fill="#0a1a36" stroke="#2563eb" stroke-width="1"/>
    <text x="12" y="20" fill="#60a5fa" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">ROC-AUC</text>
    <text x="12" y="42" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="18" font-weight="800">0.8439</text>
  </g>

  <g transform="translate(620, 300)">
    <rect width="145" height="55" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="12" y="20" fill="#a5b4fc" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">TOTAL TEST</text>
    <text x="12" y="42" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="18" font-weight="800">1,057</text>
  </g>

  <!-- Bottom Insight Strip -->
  <g transform="translate(40, 385)">
    <rect width="720" height="42" rx="8" fill="#021a24" stroke="#0891b2" stroke-width="1"/>
    <text x="16" y="26" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">Key Takeaway:</text>
    <text x="125" y="26" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11">215 of 281 actual churners (76.5%) intercepted before leaving. 1 in 2 flagged customers confirmed churner.</text>
  </g>
</svg>
