<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradTelco3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="800" height="450" rx="12" fill="url(#bgGradTelco3)"/>
  <rect width="800" height="450" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="38" fill="#f8fafc" font-family="Inter, sans-serif" font-size="16" font-weight="700">Logistic Regression Feature Coefficients (Drivers of Churn)</text>
  <text x="40" y="58" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">Standardized Log-Odds Multipliers · Center Zero Line · Transparent Model Explainability</text>

  <!-- Center zero axis: x=400 -->
  <line x1="400" y1="80" x2="400" y2="390" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="400" y="75" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">0.0 (Baseline)</text>
  <text x="210" y="75" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" text-anchor="middle">← Pulls Churn DOWN (Retention Drivers)</text>
  <text x="590" y="75" fill="#f43f5e" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" text-anchor="middle">Pushes Churn UP (Risk Drivers) →</text>

  <!-- Bars: scale factor 1 unit = 140px -->

  <!-- 1. tenure (-1.613) -->
  <g transform="translate(0, 95)">
    <text x="385" y="16" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="end">Tenure (Loyalty duration)</text>
    <rect x="174" y="4" width="226" height="18" rx="4" fill="#059669"/>
    <text x="164" y="17" fill="#6ee7b7" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" text-anchor="end">-1.613</text>
  </g>

  <!-- 2. TotalCharges (+1.005) -->
  <g transform="translate(0, 125)">
    <text x="415" y="16" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="11">TotalCharges (Historical Spend)</text>
    <rect x="400" y="4" width="141" height="18" rx="4" fill="#e11d48"/>
    <text x="550" y="17" fill="#fda4af" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">+1.005</text>
  </g>

  <!-- 3. Contract = Two year (-0.747) -->
  <g transform="translate(0, 155)">
    <text x="385" y="16" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="end">Contract: Two-Year Lock</text>
    <rect x="295" y="4" width="105" height="18" rx="4" fill="#10b981"/>
    <text x="285" y="17" fill="#6ee7b7" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" text-anchor="end">-0.747</text>
  </g>

  <!-- 4. Contract = Month-to-month (+0.684) -->
  <g transform="translate(0, 185)">
    <text x="415" y="16" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="11">Contract: Month-to-Month</text>
    <rect x="400" y="4" width="96" height="18" rx="4" fill="#f43f5e"/>
    <text x="505" y="17" fill="#fda4af" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">+0.684</text>
  </g>

  <!-- 5. MonthlyCharges (-0.566) -->
  <g transform="translate(0, 215)">
    <text x="385" y="16" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="end">MonthlyCharges (Interaction)</text>
    <rect x="321" y="4" width="79" height="18" rx="4" fill="#10b981"/>
    <text x="311" y="17" fill="#6ee7b7" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" text-anchor="end">-0.566</text>
  </g>

  <!-- 6. InternetService = Fiber optic (+0.547) -->
  <g transform="translate(0, 245)">
    <text x="415" y="16" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="11">Internet: Fiber Optic Line</text>
    <rect x="400" y="4" width="77" height="18" rx="4" fill="#f43f5e"/>
    <text x="486" y="17" fill="#fda4af" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">+0.547</text>
  </g>

  <!-- 7. InternetService = DSL (-0.530) -->
  <g transform="translate(0, 275)">
    <text x="385" y="16" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="end">Internet: Standard DSL</text>
    <rect x="326" y="4" width="74" height="18" rx="4" fill="#10b981"/>
    <text x="316" y="17" fill="#6ee7b7" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" text-anchor="end">-0.530</text>
  </g>

  <!-- 8. No OnlineSecurity (+0.272) -->
  <g transform="translate(0, 305)">
    <text x="415" y="16" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="11">Security: No Online Protection</text>
    <rect x="400" y="4" width="38" height="18" rx="4" fill="#fb7185"/>
    <text x="447" y="17" fill="#fda4af" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">+0.272</text>
  </g>

  <!-- 9. Payment = Electronic check (+0.149) -->
  <g transform="translate(0, 335)">
    <text x="415" y="16" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="11">Payment: Electronic Check</text>
    <rect x="400" y="4" width="21" height="18" rx="4" fill="#fb7185"/>
    <text x="430" y="17" fill="#fda4af" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">+0.149</text>
  </g>

  <!-- 10. Has Dependents (-0.288) -->
  <g transform="translate(0, 365)">
    <text x="385" y="16" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="end">Customer Has Family / Dependents</text>
    <rect x="360" y="4" width="40" height="18" rx="4" fill="#10b981"/>
    <text x="350" y="17" fill="#6ee7b7" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" text-anchor="end">-0.288</text>
  </g>

  <!-- Footer Callout -->
  <g transform="translate(40, 400)">
    <rect width="720" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="14" y="22" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">Profile of At-Risk Customer:</text>
    <text x="195" y="22" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10">Short tenure, month-to-month contract, fiber optic without add-on security, paying by electronic check.</text>
  </g>
</svg>
