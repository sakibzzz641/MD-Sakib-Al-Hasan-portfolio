<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#111c30"/>
    </linearGradient>
    <radialGradient id="cluster0Glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.25)"/>
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0.0)"/>
    </radialGradient>
    <radialGradient id="cluster1Glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(244, 63, 94, 0.25)"/>
      <stop offset="100%" stop-color="rgba(244, 63, 94, 0.0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="12" fill="url(#bgGrad3)"/>
  <rect width="800" height="450" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3">
    <line x1="80" y1="360" x2="740" y2="360"/>
    <line x1="80" y1="290" x2="740" y2="290"/>
    <line x1="80" y1="220" x2="740" y2="220"/>
    <line x1="80" y1="150" x2="740" y2="150"/>
    <line x1="80" y1="80" x2="740" y2="80"/>

    <line x1="150" y1="80" x2="150" y2="360"/>
    <line x1="280" y1="80" x2="280" y2="360"/>
    <line x1="410" y1="80" x2="410" y2="360"/>
    <line x1="540" y1="80" x2="540" y2="360"/>
    <line x1="670" y1="80" x2="670" y2="360"/>
  </g>

  <!-- Central axis dividers -->
  <line x1="410" y1="80" x2="410" y2="360" stroke="#334155" stroke-width="1.5"/>
  <line x1="80" y1="220" x2="740" y2="220" stroke="#334155" stroke-width="1.5"/>

  <!-- Cluster density halos -->
  <circle cx="290" cy="190" r="140" fill="url(#cluster0Glow)"/>
  <circle cx="530" cy="240" r="130" fill="url(#cluster1Glow)"/>

  <!-- Synthetic Data Points for Cluster 0 (Cyan - High Transaction & Installments) -->
  <g fill="#06b6d4" opacity="0.65">
    <circle cx="280" cy="170" r="3.5"/><circle cx="295" cy="155" r="3"/><circle cx="260" cy="190" r="3.5"/><circle cx="310" cy="180" r="3"/><circle cx="240" cy="175" r="3"/>
    <circle cx="330" cy="160" r="3.5"/><circle cx="270" cy="140" r="3"/><circle cx="315" cy="205" r="3"/><circle cx="250" cy="210" r="3.5"/><circle cx="290" cy="225" r="3"/>
    <circle cx="220" cy="185" r="3"/><circle cx="340" cy="195" r="3"/><circle cx="300" cy="130" r="3.5"/><circle cx="230" cy="150" r="3"/><circle cx="275" cy="235" r="3"/>
    <circle cx="320" cy="145" r="3"/><circle cx="355" cy="175" r="3"/><circle cx="210" cy="200" r="3"/><circle cx="285" cy="115" r="3.5"/><circle cx="365" cy="185" r="3"/>
    <circle cx="255" cy="165" r="3"/><circle cx="305" cy="170" r="3"/><circle cx="270" cy="195" r="3"/><circle cx="335" cy="210" r="3"/><circle cx="245" cy="230" r="3"/>
    <circle cx="290" cy="190" r="4"/><circle cx="315" cy="160" r="3"/><circle cx="260" cy="130" r="3"/><circle cx="340" cy="140" r="3.5"/><circle cx="230" cy="220" r="3"/>
  </g>

  <!-- Synthetic Data Points for Cluster 1 (Rose/Amber - Cash Advance & Revolving) -->
  <g fill="#f43f5e" opacity="0.65">
    <circle cx="520" cy="230" r="3.5"/><circle cx="540" cy="250" r="3"/><circle cx="490" cy="220" r="3.5"/><circle cx="560" cy="235" r="3"/><circle cx="510" cy="265" r="3"/>
    <circle cx="575" cy="220" r="3.5"/><circle cx="480" cy="245" r="3"/><circle cx="530" cy="280" r="3"/><circle cx="550" cy="210" r="3.5"/><circle cx="470" cy="260" r="3"/>
    <circle cx="600" cy="230" r="3"/><circle cx="525" cy="195" r="3"/><circle cx="580" cy="260" r="3.5"/><circle cx="460" cy="235" r="3"/><circle cx="515" cy="295" r="3"/>
    <circle cx="565" cy="275" r="3"/><circle cx="610" cy="245" r="3"/><circle cx="495" cy="275" r="3"/><circle cx="535" cy="180" r="3.5"/><circle cx="620" cy="260" r="3"/>
    <circle cx="505" cy="240" r="3"/><circle cx="545" cy="225" r="3"/><circle cx="475" cy="215" r="3"/><circle cx="585" cy="205" r="3"/><circle cx="450" cy="250" r="3"/>
    <circle cx="530" cy="240" r="4"/><circle cx="570" cy="250" r="3"/><circle cx="485" cy="290" r="3"/><circle cx="595" cy="215" r="3.5"/><circle cx="440" cy="270" r="3"/>
  </g>

  <!-- Centroids -->
  <g stroke="#ffffff" stroke-width="2.5">
    <!-- Centroid 0 -->
    <polygon points="285,170 295,190 275,190" fill="#06b6d4"/>
    <circle cx="285" cy="183" r="8" fill="none" stroke="#06b6d4" stroke-width="1.5"/>

    <!-- Centroid 1 -->
    <polygon points="535,225 545,245 525,245" fill="#f43f5e"/>
    <circle cx="535" cy="238" r="8" fill="none" stroke="#f43f5e" stroke-width="1.5"/>
  </g>

  <!-- Centroid Labels -->
  <text x="285" y="210" fill="#06b6d4" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" text-anchor="middle">Centroid 0 (Purchasers)</text>
  <text x="535" y="265" fill="#f43f5e" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" text-anchor="middle">Centroid 1 (Cash Advance)</text>

  <!-- Legend -->
  <rect x="520" y="20" width="220" height="50" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155"/>
  <circle cx="535" cy="36" r="5" fill="#06b6d4"/>
  <text x="548" y="40" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11">Cluster 0: Frequent Buyers</text>
  <circle cx="535" cy="54" r="5" fill="#f43f5e"/>
  <text x="548" y="58" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11">Cluster 1: Cash Advance Users</text>

  <!-- Axis Titles -->
  <text x="410" y="390" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Principal Component 1 (Transaction &amp; Purchase Frequency)</text>
  <text x="35" y="220" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" transform="rotate(-90 35 220)">Principal Component 2 (Cash Advance &amp; Balance)</text>

  <!-- Title -->
  <text x="80" y="38" fill="#f8fafc" font-family="Inter, sans-serif" font-size="15" font-weight="600">2D Customer Segment Distribution (PCA Space)</text>
  <text x="80" y="56" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Mapping 8,950 accounts across 2 primary behavioral dimensions</text>
</svg>
