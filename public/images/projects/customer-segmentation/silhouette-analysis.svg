<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#111c30"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="peakBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="12" fill="url(#bgGrad2)"/>
  <rect width="800" height="450" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3">
    <line x1="80" y1="360" x2="740" y2="360"/>
    <line x1="80" y1="280" x2="740" y2="280"/>
    <line x1="80" y1="200" x2="740" y2="200"/>
    <line x1="80" y1="120" x2="740" y2="120"/>
  </g>

  <!-- Axes -->
  <line x1="80" y1="90" x2="80" y2="360" stroke="#475569" stroke-width="1.5"/>
  <line x1="80" y1="360" x2="750" y2="360" stroke="#475569" stroke-width="1.5"/>

  <!-- Y-Axis Labels -->
  <text x="68" y="364" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="end">0.00</text>
  <text x="68" y="284" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="end">0.10</text>
  <text x="68" y="204" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="end">0.20</text>
  <text x="68" y="124" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="end">0.30</text>

  <!-- Y-Axis Title -->
  <text x="30" y="225" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="12" font-weight="500" text-anchor="middle" transform="rotate(-90 30 225)">Silhouette Coefficient</text>

  <!-- Peak Highlight Box -->
  <rect x="120" y="140" width="50" height="220" rx="4" fill="url(#peakBarGrad)" stroke="#10b981" stroke-width="1.5"/>
  <text x="145" y="128" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" text-anchor="middle">0.2600</text>
  <text x="145" y="112" fill="#10b981" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">OPTIMAL</text>

  <!-- Bars for k=3 to k=10 -->
  <!-- k=3 (0.218) -> height ~ 174.4 -> y = 360 - 174.4 = 185.6 -->
  <rect x="185" y="186" width="45" height="174" rx="4" fill="url(#barGrad)"/>
  <text x="207" y="178" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">0.218</text>

  <!-- k=4 (0.198) -> height ~ 158.4 -> y = 201.6 -->
  <rect x="250" y="202" width="45" height="158" rx="4" fill="url(#barGrad)"/>
  <text x="272" y="194" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">0.198</text>

  <!-- k=5 (0.182) -> height ~ 145.6 -> y = 214.4 -->
  <rect x="315" y="214" width="45" height="146" rx="4" fill="url(#barGrad)"/>
  <text x="337" y="206" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">0.182</text>

  <!-- k=6 (0.171) -> height ~ 136.8 -> y = 223.2 -->
  <rect x="380" y="223" width="45" height="137" rx="4" fill="url(#barGrad)"/>
  <text x="402" y="215" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">0.171</text>

  <!-- k=7 (0.165) -> height ~ 132 -> y = 228 -->
  <rect x="445" y="228" width="45" height="132" rx="4" fill="url(#barGrad)"/>
  <text x="467" y="220" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">0.165</text>

  <!-- k=8 (0.160) -> height ~ 128 -> y = 232 -->
  <rect x="510" y="232" width="45" height="128" rx="4" fill="url(#barGrad)"/>
  <text x="532" y="224" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">0.160</text>

  <!-- k=9 (0.154) -> height ~ 123 -> y = 237 -->
  <rect x="575" y="237" width="45" height="123" rx="4" fill="url(#barGrad)"/>
  <text x="597" y="229" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">0.154</text>

  <!-- k=10 (0.149) -> height ~ 119 -> y = 241 -->
  <rect x="640" y="241" width="45" height="119" rx="4" fill="url(#barGrad)"/>
  <text x="662" y="233" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">0.149</text>

  <!-- X-Axis Labels -->
  <text x="145" y="382" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" text-anchor="middle">k = 2</text>
  <text x="207" y="382" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">k = 3</text>
  <text x="272" y="382" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">k = 4</text>
  <text x="337" y="382" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">k = 5</text>
  <text x="402" y="382" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">k = 6</text>
  <text x="467" y="382" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">k = 7</text>
  <text x="532" y="382" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">k = 8</text>
  <text x="597" y="382" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">k = 9</text>
  <text x="662" y="382" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">k = 10</text>

  <text x="400" y="415" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Number of Clusters (k)</text>

  <!-- Header -->
  <text x="80" y="40" fill="#f8fafc" font-family="Inter, sans-serif" font-size="15" font-weight="600">K-Means Silhouette Score Evaluation (k=2 to 10)</text>
  <text x="80" y="58" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Global maximum silhouette observed at k=2 (Score: 0.2600) on 9-Component PCA Space</text>
</svg>
