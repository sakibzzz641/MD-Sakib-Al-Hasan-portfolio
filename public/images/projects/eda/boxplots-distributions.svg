<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradDist" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#111c30"/>
    </linearGradient>
    <linearGradient id="distGradBefore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(244, 63, 94, 0.4)"/>
      <stop offset="100%" stop-color="rgba(244, 63, 94, 0.0)"/>
    </linearGradient>
    <linearGradient id="distGradAfter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.4)"/>
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.0)"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="12" fill="url(#bgGradDist)"/>
  <rect width="800" height="450" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <text x="60" y="45" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="16" font-weight="700">Distribution Normalization &amp; Outlier Audit</text>
  <text x="60" y="65" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">Comparison of Skewed Raw Feature vs. Log-Transformed Normal Distribution (Pandas/Seaborn)</text>

  <!-- Left Chart: Raw Right-Skewed -->
  <g transform="translate(60, 90)">
    <rect width="320" height="280" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#f43f5e" font-family="Inter, sans-serif" font-size="13" font-weight="700">Before: Right-Skewed Raw Features</text>
    <text x="20" y="48" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">Skewness = +4.12 (High variance outliers)</text>

    <!-- Curve fill -->
    <path d="M 30 240 Q 50 80, 70 90 T 110 200 T 190 235 T 290 240 Z" fill="url(#distGradBefore)"/>
    <!-- Curve stroke -->
    <path d="M 30 240 Q 50 80, 70 90 T 110 200 T 190 235 T 290 240" fill="none" stroke="#f43f5e" stroke-width="2.5"/>

    <!-- Outlier dots -->
    <circle cx="230" cy="235" r="3" fill="#f43f5e"/>
    <circle cx="260" cy="238" r="3" fill="#f43f5e"/>
    <circle cx="280" cy="239" r="3" fill="#f43f5e"/>

    <line x1="30" y1="240" x2="290" y2="240" stroke="#475569" stroke-width="1.5"/>
    <text x="160" y="262" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">Transaction Values ($)</text>
  </g>

  <!-- Right Chart: Normalized Distribution -->
  <g transform="translate(420, 90)">
    <rect width="320" height="280" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#10b981" font-family="Inter, sans-serif" font-size="13" font-weight="700">After: log1p Transformation</text>
    <text x="20" y="48" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">Skewness = +0.18 (Near Gaussian Bell Curve)</text>

    <!-- Gaussian Curve fill -->
    <path d="M 30 240 Q 110 230, 160 85 Q 210 230, 290 240 Z" fill="url(#distGradAfter)"/>
    <!-- Gaussian Curve stroke -->
    <path d="M 30 240 Q 110 230, 160 85 Q 210 230, 290 240" fill="none" stroke="#10b981" stroke-width="2.5"/>

    <!-- Mean line -->
    <line x1="160" y1="85" x2="160" y2="240" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="160" y="78" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">Mean (μ)</text>

    <line x1="30" y1="240" x2="290" y2="240" stroke="#475569" stroke-width="1.5"/>
    <text x="160" y="262" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">log(1 + Transaction Value)</text>
  </g>
</svg>
