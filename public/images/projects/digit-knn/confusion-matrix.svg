<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#111c30"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="12" fill="url(#bgGradCm)"/>
  <rect width="800" height="450" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <text x="50" y="45" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="16" font-weight="700">Handwritten Digits: Confusion Matrix (KNN k=5)</text>
  <text x="50" y="65" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">Diagonal intensity represents precision &amp; recall per digit (0-9)</text>

  <!-- Labels -->
